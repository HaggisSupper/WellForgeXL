[workspace]
members = [
  "src-tauri",
  "crates/core",
  "crates/three_d",
  "crates/survey",
  "crates/iscwsa",
  "crates/ac",
  "crates/bha",
  "crates/tnd",
  "crates/hydra",
  "crates/wits",
  "crates/db",
  "crates/formats",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "Proprietary"
version = "0.1.0"
authors = ["WellForge Engineering"]

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.20"
quick-xml = "0.41.0"
encoding_rs = "0.8.35"
sha2 = "0.10.9"
tempfile = "3.27.0"
