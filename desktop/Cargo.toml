[workspace]
members = [
  "src-tauri",
  "crates/core",
  "crates/three_d",
  "crates/survey",
  "crates/iscwsa",
  "crates/ac",
  "crates/bha",
  "crates/tnd",
  "crates/hydra",
  "crates/wits",
  "crates/db",
  "crates/formats",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Proprietary"
version = "0.1.0"
authors = ["WellForge Engineering"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
quick-xml = "0.38"
encoding_rs = "0.8"
sha2 = "0.10"
