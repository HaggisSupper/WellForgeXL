[package]
name = "wellforge-analytics"
version = "0.1.0"
edition = "2024"
license = "Proprietary"
publish = false

# Intentionally a nested manifest: this utility is not linked into the desktop workspace.
[workspace]

[dependencies]
duckdb = { version = "=1.4.5", default-features = false, features = ["bundled"] }
polars = { version = "=0.46.0", default-features = false }
# Keeps Polars' stack-management build dependency compatible with the repository's Rust 1.85.0 toolchain.
psm = "=0.1.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
wellforge-storage = { path = "../../crates/db" }

[dev-dependencies]
tempfile = "3"
