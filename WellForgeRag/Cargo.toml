[workspace]
resolver = "2"
members = [
  "crates/wellforge-rag-core",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.104"
arrow-array = "58.0.0"
arrow-ipc = "58.0.0"
arrow-schema = "58.0.0"
chrono = { version = "0.4.42", features = ["serde"] }
csv = "1.4.0"
futures = "0.3.31"
hex = "0.4.3"
lancedb = "0.38.0"
parquet = { version = "58.0.0", features = ["arrow"] }
quick-xml = "0.41.0"
reqwest = { version = "0.13.4", features = ["json"] }
rusqlite = { version = "0.40.2", features = ["bundled", "chrono", "uuid"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
toml = "0.9.7"
uuid = { version = "1.26.0", features = ["v4", "serde"] }
wait-timeout = "0.2.1"
yaml_serde = "0.10.7"
