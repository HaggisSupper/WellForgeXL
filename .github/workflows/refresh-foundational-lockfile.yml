name: Refresh foundational lockfile

on:
  push:
    branches:
      - feat/foundational-numerics
    paths:
      - .github/workflows/refresh-foundational-lockfile.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.0
      - name: Generate canonical Cargo.lock
        working-directory: engine
        run: cargo generate-lockfile
      - name: Refresh trajectory lockfile evidence
        shell: python
        run: |
          import hashlib
          import json
          from pathlib import Path

          lock_path = Path('engine/Cargo.lock')
          text = lock_path.read_text(encoding='utf-8').replace('\r\n', '\n')
          digest = hashlib.sha256(text.encode('utf-8')).hexdigest()
          fixture_path = Path('engine/fixtures/expected/trajectory-release-one-minimal.result.json')
          payload = json.loads(fixture_path.read_text(encoding='utf-8'))
          payload['evidence']['lockfile_hash'] = digest
          fixture_path.write_text(json.dumps(payload, indent=2) + '\n', encoding='utf-8')
          print(f'canonical_lockfile_hash={digest}')
      - name: Commit generated lockfile evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/Cargo.lock engine/fixtures/expected/trajectory-release-one-minimal.result.json
          if git diff --cached --quiet; then
            echo "Lockfile already canonical"
            exit 0
          fi
          git commit -m "build: refresh canonical Cargo lockfile [skip ci]"
          git push origin HEAD:feat/foundational-numerics
