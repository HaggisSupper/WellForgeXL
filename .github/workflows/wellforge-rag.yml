name: WellForgeRag

on:
  push:
    branches:
      - main
    paths:
      - 'WellForgeRag/**'
      - '.github/workflows/wellforge-rag.yml'
  pull_request:
    paths:
      - 'WellForgeRag/**'
      - '.github/workflows/wellforge-rag.yml'

permissions:
  contents: read

concurrency:
  group: wellforge-rag-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WellForgeRag
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            WellForgeRag/target
          key: wellforge-rag-${{ runner.os }}-${{ hashFiles('WellForgeRag/Cargo.lock') }}
          restore-keys: |
            wellforge-rag-${{ runner.os }}-
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
