name: Finish T&D hybrid blend once

on:
  push:
    branches:
      - merge/all-to-main
    paths:
      - .github/workflows/finish-tnd-hybrid-once.yml

permissions:
  contents: write

jobs:
  finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: Complete hybrid blend production surface
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          result_path = Path('engine/crates/wellforge-torque-drag-contract/src/result.rs')
          text = result_path.read_text(encoding='utf-8')
          text = replace_once(
              text,
              '    /// Measured depth in metres.\n    pub md_m: f64,\n    /// Local transverse string-center displacement in metres.\n',
              '    /// Measured depth in metres.\n    pub md_m: f64,\n    /// Effective axial tension inherited by this stiff node, in newtons.\n    pub effective_tension_n: f64,\n    /// Torque inherited by this stiff node, in newton-metres.\n    pub torque_nm: f64,\n    /// Local normal load per unit length, in newtons per metre.\n    pub normal_load_n_m: f64,\n    /// Local spatial dogleg curvature, in radians per metre.\n    pub dogleg_rad_m: f64,\n    /// Local transverse string-center displacement in metres.\n',
              'stiff node inherited loads',
          )
          marker = '/// Per-station soft-string result in canonical SI.\n'
          addition = '''/// How a final station entered the hybrid soft/stiff result.\n#[derive(Clone, Copy, Debug, Deserialize, Eq, JsonSchema, PartialEq, Serialize)]\n#[serde(rename_all = "snake_case")]\npub enum StiffPointKind {\n    /// An existing soft-string station was replaced by a stiff-string nodal state.\n    Substituted,\n    /// A new station was inserted because the stiff solver reported borehole contact.\n    InsertedContact,\n}\n\n/// Optional stiff-string detail attached to a final station.\n#[derive(Clone, Debug, Deserialize, JsonSchema, PartialEq, Serialize)]\n#[serde(deny_unknown_fields)]\npub struct StiffStationRefinement {\n    /// How this point entered the final station sequence.\n    pub kind: StiffPointKind,\n    /// Local transverse displacement in metres.\n    pub displacement_m: f64,\n    /// Signed remaining radial clearance in metres.\n    pub radial_clearance_m: f64,\n    /// Borehole contact reaction magnitude in newtons.\n    pub contact_force_n: f64,\n    /// Local bending moment magnitude in newton-metres.\n    pub bending_moment_nm: f64,\n    /// Extreme-fibre bending stress in pascals.\n    pub bending_stress_pa: f64,\n}\n\n'''
          text = replace_once(text, marker, addition + marker, 'hybrid station refinement types')
          text = replace_once(
              text,
              '    /// Dogleg severity used at this station in radians per metre.\n    pub dogleg_rad_m: f64,\n}\n\n/// Buckling screen result for a station.\n',
              '    /// Dogleg severity used at this station in radians per metre.\n    pub dogleg_rad_m: f64,\n    /// Optional stiff-string detail; absent for untouched soft-string stations.\n    #[serde(default, skip_serializing_if = "Option::is_none")]\n    pub refinement: Option<StiffStationRefinement>,\n}\n\nimpl StationResult {\n    /// Borehole contact reaction for this station, or zero for an untouched soft station.\n    #[must_use]\n    pub fn contact_force_n(&self) -> f64 {\n        self.refinement\n            .as_ref()\n            .map_or(0.0, |refinement| refinement.contact_force_n)\n    }\n}\n\n/// Buckling screen result for a station.\n',
              'station refinement field',
          )
          result_path.write_text(text, encoding='utf-8')

          lib_path = Path('engine/crates/wellforge-torque-drag-contract/src/lib.rs')
          text = lib_path.read_text(encoding='utf-8')
          text = replace_once(
              text,
              '    StiffIntervalCandidate, StiffIntervalReason, StiffIntervalResult, StiffNodeResult,\n    StiffStringResult, TnDAnalysisResult, TnDSolverEvidence, derive_stiff_interval_id,\n',
              '    StiffIntervalCandidate, StiffIntervalReason, StiffIntervalResult, StiffNodeResult,\n    StiffPointKind, StiffStationRefinement, StiffStringResult, TnDAnalysisResult,\n    TnDSolverEvidence, derive_stiff_interval_id,\n',
              'contract exports',
          )
          lib_path.write_text(text, encoding='utf-8')

          core_path = Path('engine/crates/wellforge-torque-drag-core/src/lib.rs')
          text = core_path.read_text(encoding='utf-8')
          text = replace_once(
              text,
              '    AnalysisStatus, Api7gPipeSpec, ApiSevenGCheck, BucklingScreen, OperationState, StationResult,\n    StiffIntervalCandidate, StiffIntervalReason, StiffStringMode, StringComponent,\n    TnDAnalysisRequest, TnDAnalysisResult, TnDSolverEvidence, TnDTrajectoryStation,\n',
              '    AnalysisStatus, Api7gPipeSpec, ApiSevenGCheck, BucklingScreen, OperationState, StationResult,\n    StiffConvergence, StiffIntervalCandidate, StiffIntervalReason, StiffNodeResult, StiffPointKind,\n    StiffStationRefinement, StiffStringMode, StiffStringResult, StringComponent,\n    TnDAnalysisRequest, TnDAnalysisResult, TnDSolverEvidence, TnDTrajectoryStation,\n',
              'core imports',
          )
          text = replace_once(
              text,
              '            normal_load_n_m: normal_per_m,\n            dogleg_rad_m,\n        });\n',
              '            normal_load_n_m: normal_per_m,\n            dogleg_rad_m,\n            refinement: None,\n        });\n',
              'soft station refinement default',
          )
          append = r'''

const STIFF_MD_MATCH_TOLERANCE_M: f64 = 1.0e-9;

fn station_refinement(node: &StiffNodeResult, kind: StiffPointKind) -> StiffStationRefinement {
    StiffStationRefinement {
        kind,
        displacement_m: node.displacement_m,
        radial_clearance_m: node.radial_clearance_m,
        contact_force_n: node.contact_force_n,
        bending_moment_nm: node.bending_moment_nm,
        bending_stress_pa: node.bending_stress_pa,
    }
}

fn substitute_stiff_node(station: &mut StationResult, node: &StiffNodeResult) {
    station.effective_tension_n = node.effective_tension_n;
    station.torque_nm = node.torque_nm;
    station.normal_load_n_m = node.normal_load_n_m;
    station.dogleg_rad_m = node.dogleg_rad_m;
    station.refinement = Some(station_refinement(node, StiffPointKind::Substituted));
}

/// Blend converged stiff-string nodal states into the accepted whole-well soft result.
///
/// Existing soft stations at the same measured depth are substituted. A stiff node that does not
/// coincide with a soft station is inserted only when it carries positive contact force, preventing
/// unconstrained mesh nodes from expanding the public station series. Non-converged interval nodes
/// never overwrite accepted soft values. The attached stiff result remains available for diagnostics.
#[must_use]
pub fn blend_stiff_refinement(
    mut soft_result: TnDAnalysisResult,
    stiff_result: &StiffStringResult,
) -> TnDAnalysisResult {
    for interval in &stiff_result.intervals {
        if interval.convergence != StiffConvergence::Converged {
            continue;
        }
        for node in &interval.nodes {
            if let Some(station) = soft_result
                .stations
                .iter_mut()
                .find(|station| (station.md_m - node.md_m).abs() <= STIFF_MD_MATCH_TOLERANCE_M)
            {
                substitute_stiff_node(station, node);
            } else if node.contact_force_n > 0.0 {
                soft_result.stations.push(StationResult {
                    md_m: node.md_m,
                    effective_tension_n: node.effective_tension_n,
                    torque_nm: node.torque_nm,
                    normal_load_n_m: node.normal_load_n_m,
                    dogleg_rad_m: node.dogleg_rad_m,
                    refinement: Some(station_refinement(node, StiffPointKind::InsertedContact)),
                });
            }
        }
    }
    soft_result
        .stations
        .sort_by(|left, right| left.md_m.total_cmp(&right.md_m));
    soft_result.stiff_string = Some(stiff_result.clone());
    soft_result.evidence.result_hash.clear();
    soft_result
}
'''
          if 'pub fn blend_stiff_refinement(' in text:
              raise SystemExit('blend function already exists unexpectedly')
          core_path.write_text(text.rstrip() + append, encoding='utf-8')
      - name: Format and verify focused T&D surface
        working-directory: engine
        run: |
          cargo fmt --all
          cargo clippy -p wellforge-torque-drag-contract -p wellforge-torque-drag-core -p wellforge-torque-drag-fixtures -p wellforge-torque-drag-cli --all-targets --locked -- -D warnings
          cargo test -p wellforge-torque-drag-contract -p wellforge-torque-drag-core -p wellforge-torque-drag-fixtures -p wellforge-torque-drag-cli --locked
      - name: Commit completed hybrid blend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/crates/wellforge-torque-drag-contract engine/crates/wellforge-torque-drag-core
          git commit -m "feat: complete T&D hybrid stiff blending [skip ci]"
          git push origin HEAD:merge/all-to-main
