name: Windows Excel release verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-excel:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      WELLFORGE_RELEASE_RUN_ROOT: ${{ github.workspace }}\outputs\windows-release\${{ github.run_id }}-${{ github.run_attempt }}
      WELLFORGE_RELEASE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Require licensed desktop Excel for the unchanged acceptance gate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path $env:WELLFORGE_RELEASE_RUN_ROOT | Out-Null
          $excel = $null
          try {
            $excel = New-Object -ComObject Excel.Application
            "Excel COM is available. Version: $($excel.Version)" | Set-Content "$env:WELLFORGE_RELEASE_RUN_ROOT\runner-prerequisites.txt"
          }
          catch {
            $message = 'Release acceptance is blocked: this GitHub-hosted runner has no licensed desktop Excel COM installation. The Excel, rollback, rendering, and package gates remain required; no local or self-hosted runner fallback is permitted.'
            $message | Set-Content "$env:WELLFORGE_RELEASE_RUN_ROOT\runner-prerequisites.txt"
            throw $message
          }
          finally {
            if ($null -ne $excel) {
              $excel.Quit()
              [void][Runtime.InteropServices.Marshal]::FinalReleaseComObject($excel)
            }
          }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.19.0'
          cache: npm
          package-manager-cache: false
      - run: npm ci
      - name: Run bounded native, Excel, rollback, rendering, and package acceptance
        shell: powershell
        run: |
          ./tools/Invoke-WellForgeWindowsReleaseBounded.ps1 `
            -RunRoot $env:WELLFORGE_RELEASE_RUN_ROOT `
            -ExpectedGitSha '${{ github.sha }}' `
            -RunId $env:WELLFORGE_RELEASE_RUN_ID `
            -TimeoutMinutes 75
      - name: Write release evidence
        if: always()
        shell: powershell
        run: |
          ./tools/Write-WellForgeReleaseEvidence.ps1 `
            -GateResultsPath "$env:WELLFORGE_RELEASE_RUN_ROOT\gate-results.json" `
            -ArchivePath "$env:WELLFORGE_RELEASE_RUN_ROOT\wellforgexl-windows-${{ github.sha }}.zip" `
            -SupportRoot $env:WELLFORGE_RELEASE_RUN_ROOT `
            -EvidencePath "$env:WELLFORGE_RELEASE_RUN_ROOT\release-evidence.json" `
            -ExpectedGitSha '${{ github.sha }}' `
            -RunId $env:WELLFORGE_RELEASE_RUN_ID
      - name: Retain exact release archive, rendered charts, logs, and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wellforgexl-windows-release-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ env.WELLFORGE_RELEASE_RUN_ROOT }}/wellforgexl-windows-${{ github.sha }}.zip
            ${{ env.WELLFORGE_RELEASE_RUN_ROOT }}/release-evidence.json
            ${{ env.WELLFORGE_RELEASE_RUN_ROOT }}/gate-results.json
            ${{ env.WELLFORGE_RELEASE_RUN_ROOT }}/logs/**
            ${{ env.WELLFORGE_RELEASE_RUN_ROOT }}/chart-renders/**
            ${{ env.WELLFORGE_RELEASE_RUN_ROOT }}/runner-prerequisites.txt
