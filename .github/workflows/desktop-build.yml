name: Windows desktop hosted build

on:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/desktop-build.yml']
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop-build.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: Install frontend dependencies
        run: npm ci
      - name: Frontend type check
        run: npm run typecheck
      - name: Frontend tests
        run: npm test
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Build frontend assets
        run: npm run build
      - name: Rust lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Rust tests
        run: cargo test --workspace --locked
      - name: Build embedded native desktop executable
        run: cargo build --release --locked -p wellforge-app --features tauri/custom-protocol
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wellforge-desktop-windows-x64
          path: |
            desktop/target/release/wellforge-app.exe
            desktop/dist/**
          if-no-files-found: error
          retention-days: 30
