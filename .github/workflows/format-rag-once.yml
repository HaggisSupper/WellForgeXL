name: Format WellForgeRag once

on:
  push:
    branches:
      - merge/all-to-main
    paths:
      - .github/workflows/format-rag-once.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.0
          components: rustfmt
      - name: Apply rustfmt
        working-directory: WellForgeRag
        run: cargo fmt --all
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add WellForgeRag
          if git diff --cached --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git commit -m "style: format WellForgeRag [skip ci]"
          git push origin HEAD:merge/all-to-main
