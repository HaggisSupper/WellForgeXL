[advisories]
# Transitive macro dependency of current faer/nalgebra; advisory is
# unmaintained-only, has no vulnerability and has no safe upstream upgrade.
ignore = ["RUSTSEC-2024-0436"]

[licenses]
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
