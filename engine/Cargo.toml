[workspace]
resolver = "3"
members = [
  "crates/wellforge-numerics-acceptance",
  "crates/wellforge-units",
  "crates/wellforge-witsml",
  "crates/wellforge-trajectory-contract",
  "crates/wellforge-trajectory-core",
  "crates/wellforge-trajectory-analysis",
  "crates/wellforge-trajectory-fixtures",
  "crates/wellforge-trajectory-cli",
  "crates/wellforge-bha-contract",
  "crates/wellforge-bha-fixtures",
  "crates/wellforge-bha-model",
  "crates/wellforge-bha-static",
  "crates/wellforge-bha-modal",
  "crates/wellforge-bha-cli",
  "crates/wellforge-bha-interchange",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
authors = ["WellForge Engineering"]

[workspace.dependencies]
schemars = { version = "1.1.0", features = ["uuid1"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
thiserror = "2.0.20"
uom = { version = "0.38.0", features = ["f64", "si"] }
uuid = { version = "1.20.0", features = ["serde", "v5"] }
anyhow = "1.0.102"
clap = { version = "4.6.0", features = ["derive"] }
faer = "0.24.4"
hex = "0.4.3"
levenberg-marquardt = "0.15.0"
nalgebra = "0.34.2"
num-complex = "0.4.6"
parry3d-f64 = "0.30.2"
petgraph = "0.8.3"
quick-xml = "0.41.0"
rayon = "1.11.0"
semver = "1.0.28"
tempfile = "3.27.0"
url = "2.5.8"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
